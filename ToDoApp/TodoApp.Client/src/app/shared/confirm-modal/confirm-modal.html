<div class="modal-backdrop">

  <div class="confirm-modal">

    <div class="modal-header">
      <h5 class="modal-title">
        {{ title }}
      </h5>

      <button
        type="button"
        class="close-button"
        (click)="onCancel()"
        [disabled]="isLoading"
      >
        ×
      </button>
    </div>

    <div class="modal-body">
      <p>
        {{ message }}
      </p>
    </div>

    <div class="modal-footer">

      <button
        type="button"
        class="btn btn-secondary"
        (click)="onCancel()"
        [disabled]="isLoading"
      >
        Cancel
      </button>

      <button
        type="button"
        class="btn btn-danger"
        (click)="onConfirm()"
        [disabled]="isLoading"
      >
        @if (isLoading) 
        {
          Deleting...
        } 
        @else 
        {
          {{ confirmText }}
        }
      </button>
    </div>
  </div>
</div>
