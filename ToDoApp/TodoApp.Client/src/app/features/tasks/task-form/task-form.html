<div class="task-form-card">

  <div class="mb-4">
    <h3 class="mb-1">Create Task</h3>
    <p class="text-muted mb-0">
      Add a new task to your list.
    </p>
  </div>

  @if (errorMessage) 
  {
    <div class="alert alert-danger" role="alert">
      {{ errorMessage }}
    </div>
  }

  <form (ngSubmit)="onSubmit()">

    <div class="mb-3">
      <label for="title" class="form-label">
        Title <span class="text-danger">*</span>
      </label>

      <input
        id="title"
        type="text"
        class="form-control"
        name="title"
        [(ngModel)]="task.title"
        placeholder="Enter task title"
        maxlength="100"
        autocomplete="off"
      />

      <div class="form-text">
        {{ task.title.length }}/100 characters
      </div>
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">
        Description
      </label>

      <textarea
        id="description"
        class="form-control"
        name="description"
        [(ngModel)]="task.description"
        rows="4"
        maxlength="1000"
        placeholder="Enter task description"
      ></textarea>

      <div class="form-text">
        {{ task.description?.length ?? 0 }}/1000 characters
      </div>
    </div>

    <div class="row">

      <div class="col-md-6 mb-3">
        <label for="category" class="form-label">
          Category
        </label>

        <select
          id="category"
          class="form-select"
          name="categoryId"
          [(ngModel)]="task.categoryId"
        >
          <option [ngValue]="null">
            No category
          </option>

          @for (category of categories; track category.id) 
          {
            <option [ngValue]="category.id">
              {{ category.name }}
            </option>
          }
        </select>
      </div>

      <div class="col-md-6 mb-3">
        <label for="dueDate" class="form-label">
          Due Date
        </label>

        <input
          id="dueDate"
          type="datetime-local"
          class="form-control"
          name="dueDate"
          [(ngModel)]="task.dueDate"
        />
      </div>

    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">

      <button
        type="button"
        class="btn btn-outline-secondary"
        [disabled]="isLoading"
        (click)="onCancel()"
      >
        Cancel
      </button>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="isLoading"
      >
        @if (isLoading) 
        {
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
          Creating...
        } 
        @else 
        {
          Create Task
        }
      </button>
    </div>
  </form>
</div>
